<header class="site-nav">
  <div class="nav-container">
    <a href="/" class="logo" aria-label="Evolix Studio Home">
      <img src="/assets/evolix-logo.webp" alt="Evolix Studio Digital Agency Logo" width="32" height="32" style="aspect-ratio:1/1; object-fit:contain;" />
      <span>Evolix</span>
    </a>

    <!-- KokonutUI Morphic Navbar -->
    <nav class="morphic-nav-wrapper" data-page="{{page:key}}" id="mainNavLinks">
      <div class="morphic-nav-glass">
        <a href="/" class="morphic-nav-link" data-key="home">Home</a>
        <a href="/services" class="morphic-nav-link" data-key="services">Services</a>
        <a href="/work" class="morphic-nav-link" data-key="work">Work</a>
        <a href="/event" class="morphic-nav-link" data-key="event">Event</a>
        <a href="/contact" class="morphic-nav-link" data-key="contact">Contact</a>
      </div>
    </nav>

    <div class="nav-right">
      <!-- KokonutUI Switch Button -->
      <button class="kokonut-switch-btn" id="themeToggle" type="button" aria-label="Toggle Light and Dark Theme" title="Toggle Theme">
        <div class="kokonut-switch-inner">
          <svg class="kokonut-sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.41"></path>
          </svg>
          <span class="kokonut-switch-label">
            <span class="label-light">Light<span class="label-glow-line"></span></span>
            <span class="label-dark">Dark<span class="label-glow-line"></span></span>
            <span class="label-spacer">Light</span>
          </span>
        </div>
        <span class="kokonut-sheen-sweep"></span>
        <span class="kokonut-sheen-radial"></span>
      </button>

      <a href="/contact" class="btn btn-accent nav-cta">Start a project</a>
    </div>
  </div>
</header>

<script>
  (function () {
    // KokonutUI Morphic Navbar Interactive Controller
    var nav = document.getElementById("mainNavLinks");
    if (!nav) return;
    var currentKey = nav.getAttribute("data-page") || "home";
    var links = Array.prototype.slice.call(nav.querySelectorAll(".morphic-nav-link"));

    function renderMorphicState(activeKey) {
      var activeIdx = -1;
      links.forEach(function (link, idx) {
        if (link.getAttribute("data-key") === activeKey) {
          activeIdx = idx;
        }
      });

      links.forEach(function (link, idx) {
        link.className = "morphic-nav-link";
        var isCurrent = (idx === activeIdx);
        var isFirst = (idx === 0);
        var isLast = (idx === links.length - 1);
        var prevIsActive = (activeIdx !== -1 && idx - 1 === activeIdx);
        var nextIsActive = (activeIdx !== -1 && idx + 1 === activeIdx);

        if (isCurrent) {
          link.classList.add("is-active");
        } else {
          if (prevIsActive || isFirst) {
            link.classList.add("rounded-l-xl");
          }
          if (nextIsActive || isLast) {
            link.classList.add("rounded-r-xl");
          }
        }
      });
    }

    // Initial render for active page
    renderMorphicState(currentKey);

    // Dynamic hover morphing
    links.forEach(function (link) {
      link.addEventListener("mouseenter", function () {
        var key = link.getAttribute("data-key");
        renderMorphicState(key);
      });
    });

    nav.addEventListener("mouseleave", function () {
      renderMorphicState(currentKey);
    });

    // KokonutUI Theme Switcher Handler
    var toggleBtn = document.getElementById("themeToggle");
    if (toggleBtn) {
      toggleBtn.addEventListener("click", function () {
        var current = document.documentElement.getAttribute("data-theme") || "dark";
        var next = current === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("evolix-theme", next);
      });
    }
  })();
</script>
