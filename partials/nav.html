<!-- Universal Global Page Transition Overlay -->
<div class="global-page-transition" id="globalPageTransition" aria-hidden="true">
  <span class="global-transition-word" id="globalTransitionWord">Services</span>
</div>

<header class="site-nav">
  <div class="nav-container">
    <a href="/" class="logo" data-transition="Evolix">
      <img src="/assets/evolix-logo.webp" alt="Evolix Studio Digital Agency Logo" width="28" height="28" />
      <span>Evolix</span>
    </a>

    <!-- KokonutUI Morphic Navbar -->
    <nav class="morphic-nav-wrapper" data-page="{{page:key}}" id="mainNavLinks">
      <div class="morphic-nav-glass">
        <a href="/" class="morphic-nav-link" data-key="home" data-transition="Home">Home</a>
        <a href="/services.html" class="morphic-nav-link" data-key="services" data-transition="Services">Services</a>
        <a href="/work.html" class="morphic-nav-link" data-key="work" data-transition="Work">Work</a>
        <a href="/contact.html" class="morphic-nav-link" data-key="contact" data-transition="Contact">Contact</a>
      </div>
    </nav>

    <div class="nav-right">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle Light/Dark Theme">
        <span class="theme-icon sun">☀️</span>
        <span class="theme-icon moon">🌙</span>
      </button>
      <a href="/contact.html" class="btn btn-accent nav-cta" data-transition="Contact">Start a project</a>
    </div>
  </div>
</header>

<script>
  (function () {
    // KokonutUI Morphic Navbar Interactive Controller
    var nav = document.getElementById("mainNavLinks");
    if (!nav) return;
    var currentKey = nav.getAttribute("data-page") || "home";
    var links = Array.prototype.slice.call(nav.querySelectorAll(".morphic-nav-link"));

    function renderMorphicState(activeKey) {
      var activeIdx = -1;
      links.forEach(function (link, idx) {
        if (link.getAttribute("data-key") === activeKey) {
          activeIdx = idx;
        }
      });

      links.forEach(function (link, idx) {
        link.className = "morphic-nav-link";
        var isCurrent = (idx === activeIdx);
        var isFirst = (idx === 0);
        var isLast = (idx === links.length - 1);
        var prevIsActive = (activeIdx !== -1 && idx - 1 === activeIdx);
        var nextIsActive = (activeIdx !== -1 && idx + 1 === activeIdx);

        if (isCurrent) {
          link.classList.add("is-active");
        } else {
          if (prevIsActive || isFirst) {
            link.classList.add("rounded-l-xl");
          }
          if (nextIsActive || isLast) {
            link.classList.add("rounded-r-xl");
          }
        }
      });
    }

    // Initial render for active page
    renderMorphicState(currentKey);

    // Dynamic hover morphing
    links.forEach(function (link) {
      link.addEventListener("mouseenter", function () {
        var key = link.getAttribute("data-key");
        renderMorphicState(key);
      });
    });

    nav.addEventListener("mouseleave", function () {
      renderMorphicState(currentKey);
    });

    // Theme toggle
    var toggleBtn = document.getElementById("themeToggle");
    if (toggleBtn) {
      toggleBtn.addEventListener("click", function () {
        var current = document.documentElement.getAttribute("data-theme") || "dark";
        var next = current === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("evolix-theme", next);
      });
    }

    // Universal Global Page Transition Handler (across Home, Work, Services, Contact)
    var overlay = document.getElementById("globalPageTransition");
    var word = document.getElementById("globalTransitionWord");

    document.addEventListener("click", function (e) {
      var target = e.target.closest("a");
      if (!target) return;

      var href = target.getAttribute("href");
      if (!href || href.startsWith("#") || href.startsWith("mailto:") || href.startsWith("tel:") || target.target === "_blank") {
        return;
      }

      // Check if clicking current page
      var currentPath = window.location.pathname.toLowerCase();
      var cleanHref = href.toLowerCase().split("?")[0].split("#")[0];
      
      if (
        (cleanHref === "/" && (currentPath === "/" || currentPath.endsWith("index.html"))) ||
        (cleanHref.indexOf("services") !== -1 && currentPath.indexOf("services") !== -1) ||
        (cleanHref.indexOf("work") !== -1 && currentPath.indexOf("work") !== -1) ||
        (cleanHref.indexOf("contact") !== -1 && currentPath.indexOf("contact") !== -1)
      ) {
        return;
      }

      // Intercept and animate
      if (cleanHref === "/" || cleanHref.endsWith(".html") || cleanHref.startsWith("/services") || cleanHref.startsWith("/work") || cleanHref.startsWith("/contact")) {
        e.preventDefault();

        // Immediately update morphic nav state for instant responsive feedback
        var targetKey = target.getAttribute("data-key");
        if (targetKey) {
          currentKey = targetKey;
          renderMorphicState(targetKey);
        }

        var label = target.getAttribute("data-transition");
        if (!label) {
          if (cleanHref.indexOf("services") !== -1) label = "Services";
          else if (cleanHref.indexOf("work") !== -1) label = "Work";
          else if (cleanHref.indexOf("contact") !== -1) label = "Contact";
          else label = "Evolix";
        }

        if (word) word.textContent = label;
        if (overlay) overlay.classList.add("active");

        setTimeout(function () {
          window.location.href = href;
        }, 280);
      }
    });
  })();
</script>
